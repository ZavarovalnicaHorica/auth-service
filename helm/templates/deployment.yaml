apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            - name: AUTH_JWT_ISSUER
              value: {{ .Values.issuer | quote }}
            # Spring drops the "-" of allowed-origins in env var names. Empty = CORS off.
            - name: AUTH_CORS_ALLOWEDORIGINS
              value: {{ join "," .Values.cors.allowedOrigins | quote }}
            {{- if ne .Values.springProfile "local" }}
            # Read by application-docker.yml. The Secret is created by hand per namespace.
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: DB_PASSWORD
            {{- end }}
          # Java needs ~10-30 s to start; allow up to 2 minutes before liveness may restart it.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.port }}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.port }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.port }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
