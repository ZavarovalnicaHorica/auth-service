# Profile "docker": Docker Compose and Kubernetes, with a real Postgres.
# Values come from environment variables; the part after ":" is the fallback.
# Never write real passwords here: in Kubernetes they come from a Secret.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
  h2:
    console:
      enabled: false

auth:
  jwt:
    # Address of auth-service inside Docker Compose / Kubernetes (the Service name).
    issuer: ${AUTH_ISSUER:http://auth-service:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
