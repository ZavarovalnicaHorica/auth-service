# Profile "local": development on your machine, no Docker needed.
# H2 database in memory. Everything is deleted when the app stops.

spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console   # browse the DB at http://localhost:8081/h2-console
